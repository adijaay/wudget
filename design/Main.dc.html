<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; }
    a { color: oklch(0.52 0.09 205); } a:hover { color: oklch(0.42 0.09 205); }
    .amt { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: oklch(0.985 0.006 80); position: relative; overflow: hidden; color: oklch(0.22 0.015 60);">

  <!-- backdrop: the ledger the sheet opened over -->
  <div style="padding: 56px 20px 0 20px; opacity: 0.4;">
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px;">
      <div style="font-size: 22px; font-weight: 700;">Catat</div>
      <div style="font-size: 13px; color: oklch(0.48 0.02 60);">September</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="height: 56px; background: oklch(0.995 0.003 80); border: 1px solid oklch(0.91 0.008 70); border-radius: 12px;"></div>
      <div style="height: 56px; background: oklch(0.995 0.003 80); border: 1px solid oklch(0.91 0.008 70); border-radius: 12px;"></div>
      <div style="height: 56px; background: oklch(0.995 0.003 80); border: 1px solid oklch(0.91 0.008 70); border-radius: 12px;"></div>
    </div>
  </div>
  <div style="position: absolute; inset: 0; background: oklch(0.22 0.015 60 / 0.28);"></div>

  <!-- capture sheet -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: oklch(0.995 0.003 80); border-radius: 20px 20px 0 0; box-shadow: 0 -8px 28px oklch(0.22 0.015 60 / 0.16); padding: 10px 16px 18px 16px; display: flex; flex-direction: column; gap: 12px;">

    <div style="width: 36px; height: 4px; border-radius: 2px; background: oklch(0.88 0.008 70); align-self: center;"></div>

    <!-- type control + receipt camera -->
    <div style="display: flex; gap: 10px; align-items: center;">
      <div style="display: flex; flex-grow: 1; background: oklch(0.955 0.006 75); border-radius: 10px; padding: 3px; gap: 3px;">
        <div style="flex-grow: 1; text-align: center; padding: 7px 0; border-radius: 8px; background: {{accent}}; color: oklch(0.99 0.005 80); font-size: 13px; font-weight: 600;">Pengeluaran</div>
        <div style="flex-grow: 1; text-align: center; padding: 7px 0; border-radius: 8px; font-size: 13px; font-weight: 500; color: oklch(0.48 0.02 60);">Pemasukan</div>
        <div style="flex-grow: 1; text-align: center; padding: 7px 0; border-radius: 8px; font-size: 13px; font-weight: 500; color: oklch(0.48 0.02 60);">Transfer</div>
      </div>
      <div style="width: 38px; height: 38px; border-radius: 10px; border: 1px solid oklch(0.89 0.008 70); display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="oklch(0.38 0.02 60)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2L8 5h8l1.5 2h2A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.2"/></svg>
      </div>
    </div>

    <!-- frequency templates -->
    <div>
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.02em; color: oklch(0.55 0.02 60); margin-bottom: 6px;">SERING</div>
      <div style="display: flex; gap: 6px;">
        <div style="min-height: 44px; display: flex; align-items: center; padding: 0 13px; border-radius: 999px; background: oklch(0.955 0.006 75); border: 1px solid oklch(0.90 0.008 70); font-size: 12.5px; font-weight: 500;">Makan siang</div>
        <div style="min-height: 44px; display: flex; align-items: center; padding: 0 13px; border-radius: 999px; background: oklch(0.955 0.006 75); border: 1px solid oklch(0.90 0.008 70); font-size: 12.5px; font-weight: 500;">Transport</div>
        <div style="min-height: 44px; display: flex; align-items: center; padding: 0 13px; border-radius: 999px; background: oklch(0.955 0.006 75); border: 1px solid oklch(0.90 0.008 70); font-size: 12.5px; font-weight: 500;">Ngopi</div>
        <div style="min-height: 44px; display: flex; align-items: center; padding: 0 13px; border-radius: 999px; background: oklch(0.955 0.006 75); border: 1px solid oklch(0.90 0.008 70); font-size: 12.5px; font-weight: 500;">Pulsa</div>
      </div>
    </div>

    <!-- category row -->
    <div style="display: flex; gap: 14px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 56px;">
        <div style="width: 46px; height: 46px; border-radius: 14px; background: oklch(0.93 0.045 40); display: flex; align-items: center; justify-content: center; border: 2px solid oklch(0.62 0.10 40);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(0.45 0.09 40)" stroke-width="1.7" stroke-linecap="round"><path d="M6 3v7a3 3 0 0 0 6 0V3M9 10v11"/><path d="M17 3c-1.2 1.6-1.8 3.4-1.8 5.2 0 1.3.6 2.3 1.8 2.6V21"/></svg>
        </div>
        <div style="font-size: 10.5px; font-weight: 600;">Makan</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 56px;">
        <div style="width: 46px; height: 46px; border-radius: 14px; background: oklch(0.955 0.006 75); display: flex; align-items: center; justify-content: center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(0.50 0.06 205)" stroke-width="1.7" stroke-linecap="round"><path d="M4 16v-4.2L6 6h12l2 5.8V16"/><path d="M4 16h16v3H4z"/><circle cx="7.5" cy="16" r="1.3"/><circle cx="16.5" cy="16" r="1.3"/></svg>
        </div>
        <div style="font-size: 10.5px; color: oklch(0.48 0.02 60);">Transport</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 56px;">
        <div style="width: 46px; height: 46px; border-radius: 14px; background: oklch(0.955 0.006 75); display: flex; align-items: center; justify-content: center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(0.50 0.07 320)" stroke-width="1.7" stroke-linecap="round"><path d="M5 8h14l-1.2 11.2a1.5 1.5 0 0 1-1.5 1.3H7.7a1.5 1.5 0 0 1-1.5-1.3z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
        </div>
        <div style="font-size: 10.5px; color: oklch(0.48 0.02 60);">Belanja</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 56px;">
        <div style="width: 46px; height: 46px; border-radius: 14px; background: oklch(0.955 0.006 75); display: flex; align-items: center; justify-content: center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(0.48 0.07 130)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7"/><path d="M6 10v10h12V10"/></svg>
        </div>
        <div style="font-size: 10.5px; color: oklch(0.48 0.02 60);">Rumah</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 56px; opacity: 0.5;">
        <div style="width: 46px; height: 46px; border-radius: 14px; background: oklch(0.955 0.006 75); display: flex; align-items: center; justify-content: center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(0.50 0.06 265)" stroke-width="1.7" stroke-linecap="round"><rect x="3.5" y="6" width="17" height="12" rx="2"/><path d="M8 6v12M16 6v12"/></svg>
        </div>
        <div style="font-size: 10.5px; color: oklch(0.48 0.02 60);">Hiburan</div>
      </div>
    </div>

    <!-- subcategory chips, filtered by the selected category -->
    <div style="display: flex; gap: 6px;">
      <div style="min-height: 44px; display: flex; align-items: center; padding: 0 13px; border-radius: 999px; border: 1px solid oklch(0.89 0.008 70); font-size: 12.5px; color: oklch(0.42 0.02 60);">Sarapan</div>
      <div style="min-height: 44px; display: flex; align-items: center; padding: 0 13px; border-radius: 999px; background: oklch(0.62 0.10 40); color: oklch(0.99 0.005 80); font-size: 12.5px; font-weight: 600;">Makan siang</div>
      <div style="min-height: 44px; display: flex; align-items: center; padding: 0 13px; border-radius: 999px; border: 1px solid oklch(0.89 0.008 70); font-size: 12.5px; color: oklch(0.42 0.02 60);">Makan malam</div>
      <div style="min-height: 44px; display: flex; align-items: center; padding: 0 13px; border-radius: 999px; border: 1px solid oklch(0.89 0.008 70); font-size: 12.5px; color: oklch(0.42 0.02 60);">Jajan</div>
    </div>

    <!-- amount -->
    <div style="display: flex; align-items: baseline; justify-content: center; gap: 6px; padding: 6px 0 2px 0;">
      <span style="font-size: 20px; font-weight: 600; color: oklch(0.55 0.02 60);">Rp</span>
      <span class="amt" style="font-size: 40px; font-weight: 700; letter-spacing: -0.01em;">15.000</span>
      <span style="width: 2px; height: 34px; background: {{accent}};"></span>
    </div>

    <!-- note + wallet -->
    <div style="display: flex; gap: 8px; align-items: center;">
      <div style="flex-grow: 1; display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-radius: 10px; background: oklch(0.955 0.006 75); font-size: 13px; color: oklch(0.55 0.02 60);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="oklch(0.55 0.02 60)" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Catatan
      </div>
      <div style="display: flex; align-items: center; gap: 7px; padding: 9px 12px; border-radius: 10px; border: 1px solid oklch(0.89 0.008 70);">
        <span style="width: 18px; height: 18px; border-radius: 5px; background: oklch(0.55 0.13 245); color: oklch(0.99 0.005 80); font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;">G</span>
        <span style="font-size: 13px; font-weight: 600;">GoPay</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="oklch(0.48 0.02 60)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </div>
    </div>

    <!-- numpad -->
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px;">
      <div style="height: 52px; border-radius: 12px; background: oklch(0.945 0.008 70); display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 600;">1</div>
      <div style="height: 52px; border-radius: 12px; background: oklch(0.945 0.008 70); display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 600;">2</div>
      <div style="height: 52px; border-radius: 12px; background: oklch(0.945 0.008 70); display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 600;">3</div>
      <div style="height: 52px; border-radius: 12px; background: oklch(0.955 0.006 75); display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(0.38 0.02 60)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6H9.5L4 12l5.5 6H20z"/><path d="m13 10 4 4M17 10l-4 4"/></svg>
      </div>

      <div style="height: 52px; border-radius: 12px; background: oklch(0.945 0.008 70); display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 600;">4</div>
      <div style="height: 52px; border-radius: 12px; background: oklch(0.945 0.008 70); display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 600;">5</div>
      <div style="height: 52px; border-radius: 12px; background: oklch(0.945 0.008 70); display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 600;">6</div>
      <div style="height: 52px; border-radius: 12px; background: oklch(0.955 0.006 75); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: oklch(0.38 0.02 60); letter-spacing: -0.02em;">+ &#8722; &#215;</div>

      <div style="height: 52px; border-radius: 12px; background: oklch(0.945 0.008 70); display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 600;">7</div>
      <div style="height: 52px; border-radius: 12px; background: oklch(0.945 0.008 70); display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 600;">8</div>
      <div style="height: 52px; border-radius: 12px; background: oklch(0.945 0.008 70); display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 600;">9</div>
      <div style="height: 52px; border-radius: 12px; background: oklch(0.955 0.006 75); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;">
        <span style="font-size: 12.5px; font-weight: 700; color: oklch(0.30 0.02 60);">11 Sep</span>
        <span style="font-size: 10px; color: oklch(0.55 0.02 60);">12:24</span>
      </div>

      <div style="height: 52px; border-radius: 12px; background: oklch(0.945 0.008 70); display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 700;">.</div>
      <div style="height: 52px; border-radius: 12px; background: oklch(0.945 0.008 70); display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 600;">0</div>
      <div style="height: 52px; border-radius: 12px; background: oklch(0.945 0.008 70); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600;">000</div>
      <div style="height: 52px; border-radius: 12px; background: {{accent}}; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="oklch(0.99 0.005 80)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4.5 4.5L19 7"/></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"enum","options":["Petrol","Tanah","Plum"],"default":"Petrol","section":"Warna"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const map = {
      Petrol: 'oklch(0.52 0.09 205)',
      Tanah:  'oklch(0.55 0.10 48)',
      Plum:   'oklch(0.50 0.10 330)'
    };
    return { accent: map[this.props.accent] ?? map.Petrol };
  }
}
</script>
</body>
</html>
