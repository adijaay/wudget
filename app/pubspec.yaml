name: wudget
description: "wudget: catat pengeluaran dan pemasukan, cepat dan jujur."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  # state
  flutter_riverpod: ^2.5.1

  # persistence
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # routing
  go_router: ^14.3.0

  # formatting / ids
  intl: ^0.19.0
  uuid: ^4.5.1

  # receipt photo attachment
  image_picker: ^1.1.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  build_runner: ^2.4.13
  drift_dev: ^2.20.3
  sqlite3: ^2.4.6

flutter:
  uses-material-design: true
