name: wudget
description: "wudget: catat pengeluaran dan pemasukan, cepat dan jujur."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  # state
  flutter_riverpod: ^2.5.1

  # persistence
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # routing
  go_router: ^14.3.0

  # formatting / ids
  intl: ^0.19.0
  uuid: ^4.5.1

  # receipt photo attachment
  image_picker: ^1.1.2

  # home screen widget and app-shortcut deep links (Sprint 7)
  home_widget: ^0.6.0

  # bill reminders (Sprint 13); timezone gives zonedSchedule DST-correct delivery,
  # flutter_timezone reads the device's IANA zone name (Flutter has no other way to)
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # CSV import from a competitor export (Sprint 16)
  file_picker: ^8.1.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  build_runner: ^2.4.13
  drift_dev: ^2.23.1
  sqlite3: ^2.4.6

flutter:
  uses-material-design: true

  # Bundled rather than fetched at runtime: the app makes no network calls
  # at all (see legal/privacy-policy.en.md), so a font that needs fetching
  # would simply never arrive. OFL licence ships alongside the files.
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
